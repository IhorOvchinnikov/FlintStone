<a href="index.html" class="brand-logo-block" title="IO Wholesale Group LLC">
    <svg width="225" height="34" viewBox="0 0 225 34" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- 1. ИЗУМРУДНАЯ ТОЧКА НАД И -->
        <circle cx="9" cy="4.5" r="2" fill="#10B981"/>

        <!-- 2. БУКВА I (Того же шрифта и толщины, что и остальные буквы) -->
        <text x="6" y="25" fill="#0F172A" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="18.5px">I</text>

        <!-- 3. БУКВА O С ВЫРЕЗОМ, РАВНЫМ ТОЧКЕ НАД И -->
        <mask id="text-o-cut">
            <!-- Сама буква O в маске (белая = видимая часть) -->
            <text x="21" y="25" fill="white" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="18.5px">O</text>
            <!-- Вырез (черный = вырезает кружочек ровно с точку над i) -->
            <circle cx="27" cy="19.5" r="2" fill="black"/>
        </mask>
        <!-- Отрисовка буквы O с применённой маской выреза -->
        <text x="21" y="25" fill="#0F172A" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="18.5px" mask="url(#text-o-cut)">O</text>

        <!-- 4. НАДПИСЬ WHOLESALE GROUP -->
        <text x="47" y="25" fill="#0F172A" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="18.5px" letter-spacing="-0.2px">Wholesale Group</text>
    </svg>
